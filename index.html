<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Подходы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--l0:#B8AE98;--l1:#7FBFA8;--l2:#6AA7E0;--l3:#C492EA;--l4:#F2C14E;--gold:#F2C14E;--on-gold:#2A2006;--bad:#E07A6A}
[data-theme=dark]{--bg:#151B2B;--card:#1D2537;--card2:#253049;--line:#2F3A55;--text:#ECEFF6;--muted:#8D97AF}
[data-theme=light]{--bg:#EEF1F6;--card:#FFFFFF;--card2:#F2F4F9;--line:#DCE1EB;--text:#192033;--muted:#687188;--l0:#8A7F68;--l1:#3E9A7B;--l2:#3E82C7;--l3:#9A5CC9;--l4:#D9A21E;--gold:#F0B92E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.45 Onest,system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.disp{font-family:Unbounded,Onest,sans-serif}
#app{max-width:520px;margin:0 auto;padding:22px 18px calc(100px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hdr h1{font:700 34px/1.05 Unbounded,sans-serif;letter-spacing:-.5px}
.hdr .of{font:500 16px Unbounded,sans-serif;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.sub{margin-top:6px;color:var(--muted);font-size:14px}

.days{display:flex;justify-content:space-between;margin:22px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);width:36px}
.day i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:block}
.day.on i{background:var(--gold);border-color:var(--gold)}
.day.today i{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--text)}
.day.future{opacity:.45}
.daynote{font-size:13px;color:var(--muted);margin-bottom:20px}

.ladder{display:flex;flex-direction:column;gap:12px;margin:8px 0 22px}
.step{margin-left:calc(var(--i) * 14px);background:var(--card);border-radius:16px;padding:12px 14px 13px;border-left:4px solid var(--c)}
.step.off{opacity:.5;border-left-color:var(--line)}
.step-h{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.lv{font:700 14px Unbounded,sans-serif;color:var(--c)}
.step.off .lv{color:var(--muted)}
.lname{font-size:13.5px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font:600 15px Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.cnt.done{color:var(--c)}
.ticks{display:flex;gap:5px}
.ticks i{flex:1;max-width:26px;height:20px;border-radius:5px;background:var(--card2);border:1px solid var(--line)}
.ticks i.on{background:var(--c);border-color:var(--c)}
.ticks i.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4);opacity:.3}100%{transform:scale(1);opacity:1}}
.offnote{font-size:12.5px;color:var(--muted)}

.banner{background:color-mix(in srgb,var(--gold) 16%,var(--card));border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.actions{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.cta{background:var(--gold);color:var(--on-gold);font-weight:600;font-size:16px;border-radius:16px;padding:16px 14px;width:100%}
.cta:active,.ghost:active{transform:scale(.98)}
.ghost{background:var(--card);border-radius:16px;padding:12px 10px;font-weight:500;font-size:14px;width:100%;line-height:1.2}
.ghost b{display:block;font:600 18px Unbounded,sans-serif;margin-bottom:2px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:22px;background:var(--line);border-radius:14px;overflow:hidden}
.mini{background:var(--card);padding:12px}
.mini b{display:block;font:600 19px Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--muted)}

h2{font:600 20px Unbounded,sans-serif;margin:4px 0 14px}
h3{font-size:15px;font-weight:600;margin:22px 0 8px}
.dayblock{margin-bottom:18px}
.dayhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:28px;margin:18px 0 6px}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--card);font:500 28px/1 Onest,sans-serif;display:grid;place-items:center}
.stepper button.plus{background:color-mix(in srgb,var(--bad) 22%,var(--card));color:var(--bad)}
.stepper button:disabled{opacity:.35}
.stepper b{font:700 44px/1 Unbounded,sans-serif;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stepcap{text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px}
.mitem{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.mitem .mt{font-size:13px;color:var(--muted);width:42px;flex:none;font-variant-numeric:tabular-nums;padding-top:12px}
.mnote{resize:none;overflow:hidden;line-height:1.4;min-height:44px;display:block}
.entry .anote{font-size:14px;font-weight:400;margin-top:4px}
.entry .t1.wrap{white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere}
.mitem .inp{margin-top:0;flex:1;min-width:0}
.mdel{width:36px;height:36px;border-radius:10px;background:var(--card);color:var(--muted);font-size:20px;flex:none}
.missbtn{font-size:12px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.entry{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:6px;width:100%;text-align:left}
.badge{font:700 12px Unbounded,sans-serif;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);flex:none}
.entry .main{flex:1;min-width:0}
.entry .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t2{font-size:12.5px;color:var(--muted)}
.anx{font:600 13px Unbounded,sans-serif;padding:4px 8px;border-radius:8px;flex:none}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .cta{margin-top:18px;max-width:260px}

.card{background:var(--card);border-radius:16px;padding:14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.st{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;height:fit-content;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--l1) 20%,transparent);color:var(--l1)}
.st.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st.now{background:var(--card2);color:var(--muted)}
.goal .bar{display:flex;gap:6px;margin:12px 0 8px}
.goal .bar i{flex:1;height:8px;border-radius:4px;background:var(--card2)}
.goal .bar i.on{background:var(--l3)}

.rules p,.rules li{font-size:14.5px;line-height:1.55}
.rules ul{padding-left:18px}
.rules li{margin-bottom:5px}
.rules .lvrow{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.danger{color:var(--bad);font-weight:500;padding:12px 0}

.onb{padding-top:12vh}
.onb h1{font:700 30px/1.15 Unbounded,sans-serif;margin-bottom:14px}
.onb p{color:var(--muted);margin-bottom:22px;max-width:40ch}
.plan{margin-bottom:26px}
.plan div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.plan span{color:var(--muted)}
.onb .ghost{margin-top:10px;padding:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 10px;border-radius:10px}
.tabs button.on{color:var(--text)}
.tabs button.on svg{stroke:var(--gold)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.ov{position:fixed;inset:0;background:rgba(8,10,18,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);z-index:11;max-height:92vh;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvopt.wide{grid-column:1/-1}
.lvopt{background:var(--card);border-radius:14px;padding:11px 12px;text-align:left;border:2px solid transparent}
.lvopt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.lvopt .lv{display:block;margin-bottom:3px}
.lvopt small{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.fl{font-size:13px;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;border:1.5px solid transparent}
.chip.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.inp{width:100%;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--x);height:28px}
.xval{font:700 22px Unbounded,sans-serif;color:var(--x)}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
.sheet .cta{margin-top:18px}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(320px,86vw);background:var(--card);border-radius:18px;padding:18px;z-index:21;opacity:0;pointer-events:none;transition:.18s}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal p{margin-bottom:16px}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1;padding:11px;border-radius:12px;background:var(--card2);font-weight:500}
.modal .row .yes{background:var(--bad);color:#fff}
#mov{z-index:20}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="week" class="on"><svg viewBox="0 0 24 24"><path d="M3 20h5v-4h4v-4h4V8h5"/></svg>Неделя</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Журнал</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Динамика</button>
  <button data-tab="rules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>Правила</button>
</nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Новый подход"></div>
<div class="ov" id="mov"></div>
<div class="modal" id="modal" role="alertdialog"><p id="mtext"></p><div class="row"><button id="mno">Отмена</button><button class="yes" id="myes">Удалить</button></div></div>
<div class="toast" id="toast"></div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
const inTG = !!(TG && TG.initData);
const ver = v => { try { return inTG && TG.isVersionAtLeast(v); } catch(e){ return false; } };
const CS = ver('6.9') ? TG.CloudStorage : null;
const hap = t => { try { if(!ver('6.1')) return; t==='tap' ? TG.HapticFeedback.impactOccurred('light') : TG.HapticFeedback.notificationOccurred(t); } catch(e){} };

const PLAN = [{0:15,1:3},{1:10,2:3},{1:10,2:5,3:2},{2:5,3:5,4:1},{3:7,4:3}];
const MIN_DAYS = [1,3,3,3,3];
const LAST = PLAN.length-1;
const LEVELS = [0,1,2,3,4];
const LV = {
  0:{s:'Микроконтакт', d:'Кивок, «привет» прохожему, лишняя фраза к заказу или своё продолжение к чужому началу', c:'var(--l0)'},
  1:{s:'Любой незнакомец', d:'Заговорил без необходимости: дорога, время, комплимент, комментарий', c:'var(--l1)'},
  2:{s:'Разговор от 3 реплик', d:'То же, но разговор продержался минимум три обмена', c:'var(--l2)'},
  3:{s:'Девушке: ты понравилась', d:'Подошёл к понравившейся и прямо обозначил интерес', c:'var(--l3)'},
  4:{s:'С предложением', d:'L3 и предложил номер, инстаграм или встречу', c:'var(--l4)'}
};
const OUTCOMES = ['Коротко','Поговорили','Отказ','Контакт'];
const PLACES = ['Зал','Кафе','Улица','Коворкинг','Пляж'];
const MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const BLOB = 'approach-kpi-v1';

let S = {cfg:null, days:{}}, mode = 'memory', tab = 'week', popLevel = 0;
const app = document.getElementById('app');

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const mondayOf = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return ymd(x); };
const dm = s => { const d = parse(s); return `${d.getDate()} ${MG[d.getMonth()]}`; };
const range = w => { const a = parse(w), b = parse(addDays(w,6)); return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MG[b.getMonth()]}` : `${dm(w)} – ${dm(addDays(w,6))}`; };
const plural = (n,a,b,c) => { const m10=n%10, m100=n%100; return m10===1&&m100!==11?a : m10>=2&&m10<=4&&(m100<10||m100>=20)?b : c; };
const avg = arr => arr.length ? arr.reduce((s,x)=>s+x,0)/arr.length : null;
const f1 = x => x==null ? '—' : x.toFixed(1).replace('.',',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const xColor = x => `hsl(${165 - (x-1)*16} 58% 52%)`;

/* ---------- storage ---------- */
const cb2p = fn => new Promise((res,rej) => fn((err,v) => err ? rej(err) : res(v)));
async function load(){
  if (CS) {
    mode = 'cloud';
    const keys = await cb2p(cb => CS.getKeys(cb)), raw = {};
    for (let i=0; i<keys.length; i+=50) {
      const chunk = keys.slice(i,i+50);
      const vals = await cb2p(cb => CS.getItems(chunk, cb));
      for (const k of chunk) {
        if (!vals[k]) continue;
        if (k==='cfg') { try { S.cfg = JSON.parse(vals[k]); } catch(e){} continue; }
        let m = k.match(/^d_(.+)$/); if (m) { (raw[m[1]] = raw[m[1]] || [])[0] = vals[k]; continue; }
        m = k.match(/^p(\d+)_(.+)$/); if (m) (raw[m[2]] = raw[m[2]] || [])[+m[1]] = vals[k];
      }
    }
    for (const d in raw) { PC[d] = raw[d].length; try { S.days[d] = JSON.parse(raw[d].join('')); } catch(e){} }
  } else if (window.storage) {
    mode = 'artifact';
    try { const r = await window.storage.get(BLOB, false); if (r && r.value) S = JSON.parse(r.value); } catch(e){}
    S.days = S.days || {};
  }
}
const PC = {}, PART = 4000;
async function saveDayCloud(d){
  const v = S.days[d], str = v ? JSON.stringify(v) : '', parts = [];
  for (let i=0; i<str.length; i+=PART) parts.push(str.slice(i,i+PART));
  for (let i=0; i<parts.length; i++) await cb2p(cb => CS.setItem(i ? `p${i}_${d}` : `d_${d}`, parts[i], cb));
  for (let i=Math.max(parts.length,0); i<(PC[d]||1); i++) await cb2p(cb => CS.removeItem(i ? `p${i}_${d}` : `d_${d}`, cb));
  PC[d] = parts.length;
}
async function persist(key){
  try {
    if (mode==='cloud') {
      if (key==='cfg') S.cfg ? await cb2p(cb=>CS.setItem('cfg',JSON.stringify(S.cfg),cb)) : await cb2p(cb=>CS.removeItem('cfg',cb));
      else await saveDayCloud(key);
    } else if (mode==='artifact') await window.storage.set(BLOB, JSON.stringify(S), false);
  } catch(e){ toast('Не сохранилось, проверь интернет'); }
}
function normalize(){
  for (const d in S.days){ const v = S.days[d]; v.a = v.a || [];
    if (!v.ms){ v.ms = Array.from({length:v.m||0}, (_,k) => ({t:parse(d).getTime()+12*36e5+k*6e4, n:''})); }
    delete v.m; }
}
const dayObj = d => S.days[d] || (S.days[d] = {a:[], ms:[]});
function cleanDay(d){ const v = S.days[d]; if (v && !v.a.length && !(v.ms||[]).length) delete S.days[d]; }

/* ---------- program logic ---------- */
function weekData(w){
  let a = [], m = 0;
  for (let i=0;i<7;i++){ const v = S.days[addDays(w,i)]; if (v){ a = a.concat(v.a); m += (v.ms||[]).length; } }
  return {a, m};
}
function evalWeek(a, plan, minDays){
  const c = [0,0,0,0,0]; a.forEach(e => c[e.l]++);
  const got = {}, need = {}; let carry = 0;
  for (let l=4; l>=0; l--){ const have = c[l]+carry, n = plan[l]||0, u = Math.min(have,n); got[l]=u; need[l]=n; carry = have-u; }
  const days = new Set(a.map(e => ymd(new Date(e.t)))).size;
  const lvOk = LEVELS.every(l => got[l] >= need[l]);
  return {c, got, need, days, minDays, lvOk, closed: lvOk && days>=minDays};
}
function timeline(){
  const cur = mondayOf(new Date()), out = [];
  if (!S.cfg || S.cfg.start > cur) return out;
  let stage = 0; const att = {};
  for (let w=S.cfg.start; w<=cur; w=addDays(w,7)){
    const st = Math.min(stage,LAST); att[stage] = (att[stage]||0)+1;
    const {a,m} = weekData(w), ev = evalWeek(a, PLAN[st], MIN_DAYS[st]);
    const l3 = a.filter(e => e.l>=3);
    out.push({w, stage, st, attempt:att[stage], ev, a, m, current:w===cur,
      avgX:avg(a.map(e=>e.x)), l3n:l3.length, l3x:avg(l3.map(e=>e.x)),
      conv:(l3.length+m) ? l3.length/(l3.length+m) : null});
    if (w!==cur && ev.closed) stage++;
  }
  return out;
}
function goal(tl){
  const base = tl.find(x => x.l3n>0);
  if (!base) return {base:null, streak:0, achieved:false};
  let streak = 0, achieved = false;
  for (const x of tl){ if (x.current) break;
    const ok = x!==base && x.l3n>=5 && x.l3x!=null && x.l3x < base.l3x;
    streak = ok ? streak+1 : 0; if (streak>=2) achieved = true; }
  return {base:base.l3x, streak:Math.min(streak,2), achieved};
}

function chart(tl){
  const data = tl.slice(-8), n = data.length;
  const W=340, H=170, L=24, R=24, T=12, B=24, iw=W-L-R, ih=H-T-B, bw=iw/n;
  const maxA = Math.max(5, ...data.map(x=>x.a.length));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Подходы и тревога по неделям">`;
  s += `<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)"/>`;
  data.forEach((x,i) => { const h = x.a.length/maxA*ih;
    s += `<rect x="${L+i*bw+bw*.2}" y="${T+ih-h}" width="${bw*.6}" height="${Math.max(h,0)}" rx="4" fill="var(--l2)" opacity=".45"/>`;
    const d = parse(x.w); s += `<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${pad(d.getDate())}.${pad(d.getMonth()+1)}</text>`; });
  const pts = data.map((x,i) => x.avgX==null ? null : [L+i*bw+bw/2, T+ih-(x.avgX/10)*ih]).filter(Boolean);
  if (pts.length>1) s += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--gold)" stroke="var(--card)" stroke-width="2"/>`);
  s += `<text x="${L-6}" y="${T+8}" text-anchor="end" font-size="10" fill="var(--muted)">${maxA}</text>`;
  s += `<text x="${W-R+6}" y="${T+8}" font-size="10" fill="var(--gold)">10</text></svg>`;
  return s;
}

async function saveEntry(){
  const d = ymd(new Date());
  const v = dayObj(d);
  v.a.push({t:Date.now(), l:F.l, p:F.p.trim().slice(0,24), x:F.x, o:F.o, n:F.n.trim()});

let tt;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 1800); }
function ask(text, yes='Удалить'){
  return new Promise(res => {
    const m = document.getElementById('modal'), ov = document.getElementById('mov');
    document.getElementById('mtext').textContent = text; document.getElementById('myes').textContent = yes;
    m.classList.add('open'); ov.classList.add('open');
    const done = v => { m.classList.remove('open'); ov.classList.remove('open'); res(v); };
    document.getElementById('myes').onclick = () => done(true);
    document.getElementById('mno').onclick = () => done(false);
    ov.onclick = () => done(false);
  });
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab){ tab = b.dataset.tab; hap('tap'); render(); window.scrollTo(0,0); return; }
  if (b.dataset.start){ S.cfg = {start:b.dataset.start}; hap('success'); render(); await persist('cfg'); return; }
  if (b.dataset.lv){ F.l = +b.dataset.lv; hap('tap'); drawSheet(); return; }
  if (b.dataset.place){ F.p = F.p===b.dataset.place ? '' : b.dataset.place; drawSheet(); return; }
  if (b.dataset.out){ F.o = F.o===b.dataset.out ? '' : b.dataset.out; drawSheet(); return; }
  if (b.dataset.del){
    const [d,t] = b.dataset.del.split('|');
    if (!(await ask('Удалить этот подход?'))) return;
    S.days[d].a = S.days[d].a.filter(x => String(x.t)!==t); cleanDay(d); render(); await persist(d); return;
  }
  if (b.dataset.mday){ openMiss(b.dataset.mday); return; }
  if (b.dataset.mdel){ S.days[MD].ms.splice(+b.dataset.mdel,1); hap('tap'); drawMiss(); persist(MD); return; }
  const act = b.dataset.act;
  if (act==='add') openSheet();
  if (act==='save') saveEntry();
  if (act==='miss') openMiss(ymd(new Date()));
  if (act==='mplus'){
    const v = dayObj(MD), isToday = MD===ymd(new Date());
    v.ms.push({t: isToday ? Date.now() : parse(MD).getTime()+12*36e5+v.ms.length*6e4, n:''});
    hap('warning'); drawMiss(); persist(MD);
  }
  if (act==='mminus'){
    const v = S.days[MD]; if (!v || !v.ms.length) return;
    let li = 0; v.ms.forEach((x,i) => { if (x.t >= v.ms[li].t) li = i; });
    v.ms.splice(li,1); hap('tap'); drawMiss(); persist(MD);
  }
  if (act==='mdone') closeSheet();
  if (act==='reset'){
    if (!(await ask('Стереть все подходы и начать программу с нуля?', 'Стереть'))) return;
    const keys = Object.keys(S.days); S = {cfg:null, days:{}};
    if (mode==='cloud') { for (const k of keys) await persist(k); await persist('cfg'); } else await persist('cfg');
    tab = 'week'; render();
  }
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('mnote') && MD){
    const x = S.days[MD]?.ms[+e.target.dataset.mi]; if (!x) return;
    x.n = e.target.value; grow(e.target); clearTimeout(noteTimer); const d = MD; noteTimer = setTimeout(() => persist(d), 700);
  }
  if (e.target.id==='anote'){ F.n = e.target.value; grow(e.target); }
  if (e.target.id==='pinp'){ F.p = e.target.value; document.querySelectorAll('[data-place]').forEach(c=>c.classList.remove('sel')); }
  if (e.target.id==='xr'){ F.x = +e.target.value; const c = xColor(F.x); const xv = document.getElementById('xv'); xv.textContent = F.x; xv.style.setProperty('--x',c); e.target.style.setProperty('--x',c); }
});
document.getElementById('ov').addEventListener('click', closeSheet);

/* ---------- theme & boot ---------- */
function applyTheme(){
  const dark = inTG ? TG.colorScheme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (ver('6.1')) { const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch(e){} }
}
(async function boot(){
  if (inTG){ try { TG.ready(); TG.expand(); TG.onEvent('themeChanged', applyTheme); if (ver('6.1')) TG.BackButton.onClick(closeSheet); } catch(e){} }
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!inTG) applyTheme(); });
  try { await load(); } catch(e){ toast('Не удалось загрузить данные'); }
  normalize();
  render();
  setInterval(() => { if (tab==='week' && !document.getElementById('sheet').classList.contains('open')) render(); }, 60000);
})();
</script>
